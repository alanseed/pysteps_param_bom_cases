[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysteps-param-bom-cases"
version = "0.1.0"
description = "Bureau Rainfields3 acquisition and archive ingestion for pysteps_param"
requires-python = ">=3.12,<3.13"
dependencies = ["pysteps-param", "numpy", "scipy", "pymongo>=4", "xarray", "netCDF4", "pyproj", "rasterio>=1.3"]

[project.scripts]
bom-ingest-rainfields = "pysteps_param_bom_cases.ingest:main"
bom-extract-event-lk = "pysteps_param_bom_cases.event_lk:main"
bom-event-field-parameters = "pysteps_param_bom_cases.field_parameters:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
